/* =====================================================
   REGISTRO / LOGIN

async function submitAuth(){

    const email =
    document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();


    const password =
    document
    .getElementById("password")
    .value
    .trim();


    if(!email || !password){

        showNotice(
            "Falta información",
            "Completa tu correo y contraseña para continuar."
        );

        return;

    }


    const button =
    document.querySelector(
        "#modal .submit-btn"
    );


    button.disabled = true;

    button.textContent =
    "Procesando...";


    /* =================================================
       REGISTRO
    ================================================= */

    if(authMode === "register"){

        const first =
        document
        .getElementById("firstName")
        .value
        .trim();


        const last =
        document
        .getElementById("lastName")
        .value
        .trim();


        if(!first || !last){

            button.disabled = false;

            button.textContent =
            "Continuar";


            showNotice(
                "Falta información",
                "Completa tu nombre y apellido para crear tu cuenta."
            );

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    first_name:first,
                    last_name:last
                }
            }

        });


        button.disabled = false;

        button.textContent =
        "Continuar";


        if(error){

            showNotice(
                "No pudimos crear la cuenta",
                translateSupabaseError(error.message)
            );

            return;

        }


        closeModal();


        if(data.session){

            await loadCurrentUser();


            showNotice(
                "Cuenta creada",
                "Tu cuenta de SparkyKrea ya está lista. Bienvenido."
            );

        }else{

            showNotice(
                "Cuenta creada",
                "La cuenta fue creada correctamente. Si no puedes iniciar sesión todavía, revisa la configuración de confirmación de correo en Supabase."
            );

        }


        return;

    }


    /* =================================================
       LOGIN
    ================================================= */

    const {
        data,
        error
    } =
    await supabaseClient.auth
    .signInWithPassword({

        email:email,

        password:password

    });


    button.disabled = false;

    button.textContent =
    "Continuar";


    if(error){

        showNotice(
            "No pudimos iniciar sesión",
            translateSupabaseError(error.message)
        );

        return;

    }


    closeModal();


    await loadCurrentUser();


    showNotice(
        "Bienvenido a SparkyKrea",
        "Has iniciado sesión correctamente."
    );

}


/* =====================================================
   TRADUCIR ERRORES
===================================================== */

function translateSupabaseError(message){

    const text =
    String(message || "")
    .toLowerCase();


    if(text.includes("invalid login credentials")){

        return "El correo o la contraseña no son correctos.";

    }


    if(text.includes("user already registered")){

        return "Ya existe una cuenta registrada con ese correo.";

    }


    if(text.includes("password should be at least")){

        return "La contraseña debe tener al menos 6 caracteres.";

    }


    if(text.includes("unable to validate email address")){

        return "El correo electrónico no parece válido.";

    }


    if(text.includes("email not confirmed")){

        return "Esta cuenta todavía necesita confirmar el correo electrónico.";

    }


    if(text.includes("same password")){

        return "La nueva contraseña debe ser diferente a la anterior.";

    }


    return message ||
    "Ocurrió un problema. Inténtalo nuevamente.";

}

/* =====================================================
   ACTUALIZAR CONTRASEÑA
===================================================== */

async function updatePassword(){

    const newPassword =
    document
    .getElementById("newPassword")
    .value;


    const confirmPassword =
    document
    .getElementById("confirmPassword")
    .value;


    if(!newPassword || !confirmPassword){

        showNotice(
            "Falta información",
            "Completa los dos campos de contraseña."
        );

        return;

    }


    if(newPassword.length < 6){

        showNotice(
            "Contraseña demasiado corta",
            "La contraseña debe tener al menos 6 caracteres."
        );

        return;

    }


    if(newPassword !== confirmPassword){

        showNotice(
            "Las contraseñas no coinciden",
            "Escribe exactamente la misma contraseña en los dos campos."
        );

        return;

    }


    const button =
    document.querySelector(
        "#resetModal .reset-submit"
    );


    button.disabled = true;

    button.textContent =
    "Actualizando...";


    try{

        const {
            error
        } =
        await supabaseClient.auth
        .updateUser({

            password:newPassword

        });


        if(error){

            button.disabled = false;

            button.textContent =
            "Actualizar contraseña →";


            showNotice(
                "No pudimos actualizarla",
                translateSupabaseError(
                    error.message
                )
            );

            return;

        }


        /*
          Limpiamos los campos.
        */

        document
        .getElementById("newPassword")
        .value = "";

        document
        .getElementById("confirmPassword")
        .value = "";


        /*
          Mostramos la pantalla de éxito
          DENTRO del mismo diseño.
        */

        showPasswordResetSuccess();


    }catch(error){

        console.error(error);


        button.disabled = false;

        button.textContent =
        "Actualizar contraseña →";


        showNotice(
            "No pudimos actualizarla",
            "Ocurrió un problema al actualizar tu contraseña. Inténtalo nuevamente."
        );

    }

}

async function loadCurrentUser(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        currentUser = null;

        currentProfile = null;

        resetAuthArea();

        return;

    }


    currentUser = user;


    const {
        data:profile,
        error
    } =
    await supabaseClient

    .from("profiles")

    .select(
        "id,first_name,last_name,email,role,created_at"
    )

    .eq("id",user.id)

    .maybeSingle();


    if(error){

        console.error(error);

    }


    currentProfile = profile;


    updateAuthArea();

}

    if(!currentUser){

        resetAuthArea();

    }


    const first =
    currentProfile?.first_name ||
    currentUser.user_metadata?.first_name ||

    const last =
    currentProfile?.last_name ||

    currentProfile?.role ||
    "user";


    const isAdmin =
    role === "admin" &&

    const wrapper =
    document.createElement("div");

    "account-area";


    const name =

    logoutButton.textContent =

/* =====================================================
   CARGAR USUARIOS
===================================================== */

async function loadAdminUsers(){

    const tbody =
    document.getElementById("adminUsers");

    const count =
    document.getElementById("adminCount");


    tbody.innerHTML = `

        <tr>
            <td colspan="4">
                Cargando...
            </td>
        </tr>

    `;


    const {
        data:profiles,
        error
    } =
    await supabaseClient

    .from("profiles")

    .select(
        "id,first_name,last_name,email,role,created_at"
    )

    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        tbody.innerHTML = `

            <tr>
                <td colspan="4">
                    No se pudieron cargar los usuarios.
                </td>
            </tr>

        `;


        count.textContent =
        "Error al cargar";


        console.error(error);

        return;

    }


    count.textContent =
    profiles.length +
    (
        profiles.length === 1
        ?
        " usuario registrado"
        :
        " usuarios registrados"
    );


    if(!profiles.length){

        tbody.innerHTML = `

            <tr>
                <td colspan="4">
                    Todavía no hay usuarios registrados.
                </td>
            </tr>

        `;

        return;

    }


    tbody.innerHTML = "";


    profiles.forEach(function(profile){

        const row =
        document.createElement("tr");


        const nameCell =
        document.createElement("td");

        nameCell.textContent =
        (
            profile.first_name +
            " " +
            profile.last_name
        ).trim();


        const emailCell =
        document.createElement("td");

        emailCell.textContent =
        profile.email;


        const roleCell =
        document.createElement("td");

        roleCell.textContent =
        profile.role;


        const dateCell =
        document.createElement("td");

        dateCell.textContent =
        new Date(
            profile.created_at
        ).toLocaleDateString(
            "es-ES"
        );


        row.appendChild(nameCell);

        row.appendChild(emailCell);

        row.appendChild(roleCell);

        row.appendChild(dateCell);


        tbody.appendChild(row);

    });

}

    "message " + type;


    message.textContent =
    text;


    container.appendChild(message);


    container.scrollTop =
    container.scrollHeight;

}

/* =====================================================
   CARRUSEL
===================================================== */

const cards =
document.querySelectorAll(
    ".service-card"
);


const dotsContainer =
document.getElementById(
    "carouselDots"
);


let currentCard = 0;


/* CREAR DOTS */

cards.forEach(
function(card,index){

    const dot =
    document.createElement("div");


    dot.className =
    "carousel-dot";


    if(index === 0){

        dot.classList.add("active");

    }


    dot.addEventListener(
        "click",
        function(){

            showCard(index);

        }
    );


    dotsContainer.appendChild(dot);

});


const dots =
document.querySelectorAll(
    ".carousel-dot"
);


function showCard(index){

    cards.forEach(
        function(card){

            card.classList.remove(
                "active"
            );

        }
    );


    dots.forEach(
        function(dot){

            dot.classList.remove(
                "active"
            );

        }
    );


    cards[index]
    .classList
    .add("active");


    dots[index]
    .classList
    .add("active");


    currentCard =
    index;

}


/* CARRUSEL AUTOMÁTICO */

setInterval(
function(){

    currentCard++;


    if(currentCard >= cards.length){

        currentCard = 0;

    }


    showCard(
        currentCard
    );

},
4400
);


/* =====================================================
   ESCUCHAR ESTADO DE AUTH
   IMPORTANTE:
   ESTE LISTENER SE REGISTRA ANTES DE GETSESSION
===================================================== */

supabaseClient.auth
.onAuthStateChange(
function(event,session){

    console.log(
        "Supabase auth:",
        event
    );


    /*
      Este es el evento principal que
      Supabase dispara al volver desde
      el enlace de recuperación.
    */

    if(event === "PASSWORD_RECOVERY"){

        recoveryMode = true;


        setTimeout(
            function(){

                openResetPassword();

            },
            150
        );


        return;

    }


    /*
      Durante recuperación no dejamos que
      un evento normal cierre la pantalla.
    */

    if(recoveryMode){

        return;

    }


    if(session){

        /*
          No hacemos await aquí para evitar
          bloqueos dentro del callback.
        */

        loadCurrentUser();

    }else{

        currentUser = null;

        currentProfile = null;

        resetAuthArea();

    }

});


/* =====================================================
   SESIÓN AL ABRIR
===================================================== */

(async function(){

    /*
      Primero dejamos que Supabase procese
      el enlace de recuperación.
    */

    const recovery =
    isRecoveryUrl();


    const {
        data:{
            session
        }
    } =
    await supabaseClient.auth.getSession();


    /*
      Si venimos desde el enlace de recuperación,
      mostramos directamente la pantalla.
    */

    if(recovery){

        recoveryMode = true;


        setTimeout(
            function(){

                openResetPassword();

            },
            250
        );


        return;

    }


    /*
      Funcionamiento normal.
    */

    if(session){

        await loadCurrentUser();

    }else{

        resetAuthArea();

    }

})();


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
"keydown",
function(event){

    if(event.key === "Escape"){

        /*
          No cerramos la pantalla de recuperación
          con Escape mientras está en proceso.
        */

        if(recoveryMode){

            return;

        }


        closeModal();

        closeForgotPassword();

        closeChat();

        closeNotice();

        closeAdminPanel();

    }

});
